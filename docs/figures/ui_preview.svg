  <line x1="489" y1="150" x2="440" y2="200" stroke="#17a673" stroke-width="12" stroke-linecap="round"/>
  <line x1="489" y1="150" x2="538" y2="200" stroke="#17a673" stroke-width="12" stroke-linecap="round"/>
  <line x1="489" y1="232" x2="450" y2="300" stroke="#e06b28" stroke-width="14" stroke-linecap="round"/>
