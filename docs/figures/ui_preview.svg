  <rect x="682" y="188" width="10" height="10" rx="2" fill="#2447ff"/><text x="700" y="197" font-size="13">torso</text><text x="866" y="197" font-size="12" fill="#647086" text-anchor="end">88%</text>
  <rect x="682" y="208" width="10" height="10" rx="2" fill="#e06b28"/><text x="700" y="217" font-size="13">left_leg</text><text x="866" y="217" font-size="12" fill="#647086" text-anchor="end">81%</text>

